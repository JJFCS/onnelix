# notes
# - arrays run short sequences of stock commands;
# - @... strings replay built-in key sequences. No plugins or shell editing tools.
# - C- = Control, A- = Alt/Option (Emacs Meta), S- = Shift.


# modes:
# - normal mode word motions select their traversed span
# - select mode extends
# - insert mode types text
# - escape and unbounded keys stay native


# Undo: C-/ undoes (C-_ and legacy terminal C-7 aliases are also bound).
# C-Shift-/ or C-? redoes IF the terminal sends
# distinct events. Some terminals collapse Ctrl+Shift+/ into another key;
# C-x u / C-x U are reliable undo/redo alternatives.
# Insert-mode undo/redo returns to normal mode before using native history.
# Enter/C-j/C-o commit a checkpoint AFTER inserting the newline. Navigation
# commits BEFORE moving. Word/line deletion is bracketed by checkpoints.
# C-c u commits a checkpoint manually without leaving insert mode.
# Continuous typing on one line is still one group until a checkpoint.
# These bindings do not add timed or per-word automatic undo grouping.
#
# C-o: normal/select = open_below (enter insert mode on a new line below).
#      insert = insert_newline (split at the caret and move to the new line).
# This uses Helix's native newline actions, including its indentation rules.
#
# Multiple selections: select text first, then C-> / C-< add the next/previous
# literal match. C-c m n / p are terminal-friendly alternatives.
# C-c m j / k add a selection on the next/previous line.
# C-c m a asks for regex matches in the whole buffer; C-c s uses the selection.
# C-c m s splits a selection by lines; f filters selections by regex;
# o keeps the primary selection, r removes it, [ / ] choose the primary.
# Selection tools invoked from insert mode first return to normal mode.
#
# Alignment: select the lines, C-c s, type the delimiter regex (e.g. =), Enter,
# then C-c a. Each delimiter becomes a selection; align_selections aligns it.
# This is native column alignment, not all of Emacs align-regexp's options.
#
# M-% starts NATIVE BULK regex selection: normal/insert = whole buffer,
# select = current selection(s). Type a regex, Enter, c, replacement, Escape.
# The replacement is plain typed text; c does not expand regex capture groups.
# There is no yes/no query-replace dialog. For review one match at a time:
# C-s pattern Enter, c replacement Escape; n moves on; . repeats that edit.
# Use n again to skip a match. Begin this workflow in normal mode.
#
# C-x: C-f open; C-s save; s save all; b/C-b buffers; k close buffer; h select
# all; 0 close view; 1 only this view; 2 horizontal split; 3 vertical split;
# o next view; left/right previous/next buffer; C-x flip anchor/cursor;
# C-u/C-l uppercase/lowercase selection; u/U undo/redo; C-c quit safely.
# M-; comments; M-. definition; M-, jump back; M-g g line number;
# M-g n/p next/previous diagnostic; insert M-/ completion.
# C-c: a align; s regex selection; u checkpoint; / project search; i/I document/
# workspace symbols; d diagnostics; r rename symbol; f format selection;
# w/y system clipboard copy/paste; o open above; j save jump; [/] back/forward;
# . repeat last motion. LSP features require an appropriate language server.
#
# C-c is now a prefix in the editor; native commenting is available on M-;
# and Space c. C-w cuts; the native window menu remains on Space w.
# M-; now comments; flip_selections is on C-x C-x.
# M-. now jumps to definition; repeat_last_motion is on C-c .
# M-, now jumps back; remove_primary_selection is on C-c m r.
#
# Existing differences: C-w/M-d cut selections in normal/select; insert-mode
# M-d deletes forward and C-w deletes backward by word. C-k and insert-mode
# word deletions do not populate the yank register. C-y uses Helix's yank
# register; C-c w/y use the system clipboard. C-l centers (no cycling).
# Search is regex; Enter confirms; n/N move between matches in normal mode.
# C-space starts a fresh region; in select mode it collapses and exits.
# If the OS captures C-space, use native v after collapsing the selection.
#
# Each TOML table must appear only once when merging with another config.


# this is my own personal configurations...
theme = "naysayer"  # acme , dracula , emacs , gruber-darker , jetbrains_dark , naysayer , rose_pine

[editor]
auto-completion           =  true
auto-pairs                =  true
auto-format               =  false
auto-info                 =  true
bufferline                = "always"
color-modes               =  true
continue-comments         =  true
end-of-line-diagnostics   = "hint"
indent-heuristic          = "tree-sitter"
insert-final-newline      =  true
line-number               = "relative"
path-completion           =  true
popup-border              = "all"
preview-completion-insert =  false
trim-trailing-whitespace  =  true


[editor.statusline]
left   = ["mode", "spinner", "version-control", "read-only-indicator"]
center = ["file-name", "file-modification-indicator"]
right  = ["diagnostics", "selections", "position", "file-type"]
separator = "|"  # TODO - Experiment with other separator symbols
mode.normal = ">>>>>>>"
mode.insert = "|||||||"
mode.select = "<<<<<<<"
diagnostics = ["warning", "error"]

[editor.lsp]
enable = true
display-messages = true
display-progress-messages = false
auto-signature-help = true
display-inlay-hints = false

[editor.file-picker]
hidden = false

[editor.search]
smart-case = true
wrap-around = true

[editor.inline-diagnostics]
cursor-line = "hint"  # TODO - experiment - "disable" if dowan

[editor.whitespace.render]
space   = "none"  # TODO - other option : "all"
tab     = "none"  # TODO - other option : "all"
newline = "none"

[editor.whitespace.characters]
space = "."
tab = ">"
newline = "‡"
tabpad = "."

[editor.soft-wrap]
enable = true
wrap-indicator = "‡ "


# this is the portion on keybindings
[keys.normal]
"C-f" = "move_char_right"
"C-b" = "move_char_left"
